name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write  # attach builds to releases

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: System packages (ffmpeg for the offline test share, X/GL for the window tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libnss3 libasound2 fonts-dejavu-core
      - run: scripts/fetch_sockseek.sh linux-x64
      - run: uv sync
      - name: Tests (incl. UI checks and the real window end to end)
        run: xvfb-run -a uv run pytest -q

  appimage:
    needs: test
    runs-on: ubuntu-22.04  # older glibc = the AppImage runs on more Linux versions
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-render-util0 libxcb-image0 libnss3 libasound2 \
            libgtk-3-0 libgbm1 libdbus-1-3
      - run: uv sync
      - name: Build AppImage
        run: scripts/build_appimage.sh
      - name: Packaged app opens and answers sockseek's callback
        run: |
          APP=$(ls dist/*.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "$APP" --smoke-test
      - name: Packaged app converts FLAC to MP3 with its bundled encoder
        run: |
          sudo apt-get install -y -qq ffmpeg  # only to make the fake test share; the app doesn't use it
          APP=$(ls dist/*.AppImage); W=$(mktemp -d)
          uv run python scripts/make_mock_library.py tests/fixtures/road_trip.csv "$W/share" --missing 8 --flac 4 --flac-only 6 >/dev/null
          APPIMAGE_EXTRACT_AND_RUN=1 "$APP" run tests/fixtures/road_trip.csv --home "$W/h" --library "$W/lib" --mock-dir "$W/share" --convert-mp3 -v | grep '"MP3:"'
          test -f "$W/lib/OutKast/Speakerboxxx-The Love Below [MP3]/Hey Ya!.mp3"
          test -z "$(find "$W/lib" -name '*.flac')"
      - name: Checksum (the in-app updater verifies downloads against it)
        run: cd dist && for f in *.AppImage; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: unSpootify-linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
          retention-days: 14
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.AppImage dist/*.AppImage.sha256 --clobber

  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel  # Intel (GitHub keeps these until fall 2027)
            arch: x86_64
    name: macos (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ffmpeg (offline test share)
        run: brew install ffmpeg
      - run: uv sync
      - name: Unit + backend tests on macOS
        run: |
          scripts/fetch_sockseek.sh
          uv run pytest -q --ignore=tests/test_ui.py --ignore=tests/test_ui_real.py
      - name: Build dmg
        run: scripts/build_macos.sh
      - name: Check the app as a user gets it (from the dmg, quarantined)
        run: packaging/test/macos_check.sh dist/*.dmg
      - name: Checksum (the in-app updater verifies downloads against it)
        run: cd dist && for f in *.dmg; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: unSpootify-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          retention-days: 14
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.dmg dist/*.dmg.sha256 --clobber
