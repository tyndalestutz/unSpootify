[project]
name = "unspootify"
version = "1.0.0"
description = "Turn your Spotify playlists into a real music library."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pywebview>=5.4",
    # Linux renders the window with Qt WebEngine (self-contained in the AppImage).
    # macOS uses the system WebKit via pyobjc, which pywebview pulls in itself.
    "PySide6>=6.8; sys_platform == 'linux'",
    "qtpy>=2.4; sys_platform == 'linux'",
]

[project.scripts]
unspootify = "unspootify.app:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unspootify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
